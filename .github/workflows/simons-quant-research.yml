name: Simons quant data research (read only)

on:
  pull_request:
    paths:
      - "src/intelligence/simons_quant.py"
      - "src/intelligence/simons_history.py"
      - "scripts/simons_quant_research.py"
      - "tests/test_simons_quant.py"
      - ".github/workflows/simons-quant-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simons-quant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimum research dependencies
        run: python -m pip install "pandas>=2.2" "numpy>=1.26" "python-dateutil>=2.9" "pytest>=8" "exchange_calendars>=4.5"
      - name: Run deterministic and fail-closed unit tests
        run: python -m pytest -q tests/test_simons_quant.py
      - name: Research from fresh public market snapshots
        run: |
          python -m scripts.simons_quant_research \
            --root . --symbols SPY QQQ XLV XLE GLD TLT \
            --history-years 5 --acquire --output outputs/research/simons_quant_v1.json
      - name: Check resulting artifact and surface abstentions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/research/simons_quant_v1.json")
          report = json.loads(p.read_text())
          assert report["portfolio_data_included"] is False
          assert len(report["results"]) == 6
          assert all(not r["trade_authorized"] for r in report["results"])
          for r in report["results"]:
              print(r["symbol"], r["status"], r.get("reason", "out-of-sample research produced"))
          PY
      - name: Upload derived research report only (never raw prices or broker data)
        uses: actions/upload-artifact@v4
        with:
          name: simons-quant-derived-research
          path: outputs/research/simons_quant_v1.json
          retention-days: 7
