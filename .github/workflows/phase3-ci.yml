name: Phase 3 decision cockpit validation

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "streamlit_app.py"
      - "requirements.txt"
      - ".streamlit/**"
      - ".github/workflows/phase3-ci.yml"
      - ".github/workflows/phase3-cloud-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install existing project dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile new and legacy sources
        run: python -m compileall -q app src scripts streamlit_app.py
      - name: Full regression including Phase 3
        env:
          TRADING_DESK_PUBLIC: "1"
        run: python -m pytest -q
      - name: Streamlit server startup and health
        env:
          TRADING_DESK_PUBLIC: "1"
        shell: bash
        run: |
          python -m streamlit run streamlit_app.py --server.headless true --server.port 8501 > /tmp/phase3_streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health | grep -q ok; then
              echo "Streamlit health OK"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/phase3_streamlit.log
          exit 1
      - name: Diagnose authoritative macro provider coverage
        timeout-minutes: 2
        run: python scripts/diagnose_macro_sources.py
      - name: Official FRED-MD live source probe
        # External availability is verified independently of synthetic unit tests.
        # Failure blocks publication of this fallback until a real source works.
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from io import StringIO
          import csv
          from src.intelligence.fred_md import fetch_fred_md
          data=fetch_fred_md()
          for symbol in ("FRED:CPIAUCSL", "FRED:INDPRO"):
              record=data[symbol]
              rows=list(csv.reader(StringIO(record["payload"])))
              observed=rows[-1][0]
              age=(datetime.now(timezone.utc).date()
                   -datetime.fromisoformat(observed).date()).days
              print(symbol,record["source"],"observed",observed,
                    "age_days",age,"provider",record["source_url"],
                    "observations",len(rows)-1)
              assert 0<=age<=75, "FRED-MD monthly data are stale"
          PY
